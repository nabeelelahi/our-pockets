<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Our Pockets</title>
    <style>
      :root { color-scheme: light dark; --bg: #f6f7f5; --fg: #16201b; --muted: #5d6b64; --accent: #0f7a5a; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0f1412; --fg: #e8eeea; --muted: #9aa9a1; --accent: #3fbf8f; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font-family: system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
      p { color: var(--muted); }
      button { font: inherit; font-weight: 600; min-height: 44px; padding: 0 20px; border: 0; border-radius: 12px;
        background: var(--accent); color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Our Pockets needs a connection to load and save your budget.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
